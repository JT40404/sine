[package]
name = "sine-hooks"
version = "0.1.0"
edition = "2021"
description = "SINE Forge transfer hook: launch-phase rules (holder caps, tx caps, anti-bundle, allowlist, no P2P) and creator locks for Token-2022 coins on Meteora DBC"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "2.2"
spl-transfer-hook-interface = "0.10"
spl-tlv-account-resolution = "0.10"
spl-token-2022 = { version = "8", features = ["no-entrypoint"] }
spl-pod = "0.5"

[dev-dependencies]
solana-program-test = "2.2"
solana-sdk = "2.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
